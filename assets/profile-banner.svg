  <text x="59" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#b6c9bf">DEVELOPER / BUILDER</text>
  <text x="40" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="650" letter-spacing="-2" fill="#f6f7f1">Zoey Sandel</text>
  <text x="43" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#d0dfd5">Ideas into working software.</text>
