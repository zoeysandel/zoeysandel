<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Zoey Sandel — ideas into working software</title>
  <desc id="desc">A dark green developer card with Zoey's name, a short tagline and a small terminal illustration.</desc>
  <rect width="960" height="240" rx="18" fill="#152c26"/>
  <rect x=".5" y=".5" width="959" height="239" rx="17.5" fill="none" stroke="#345047"/>
