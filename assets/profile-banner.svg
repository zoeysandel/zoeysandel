    <text x="18" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#d0dfd5">  try it. improve it.</text>
    <path d="M20 121l5 4-5 4" fill="none" stroke="#b6db98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
